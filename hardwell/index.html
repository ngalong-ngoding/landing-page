<html>

<head>
  <title>Hardwell</title>

  <!-- FONT OPEN SANS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">

  <!-- FONT INTER -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=League+Spartan:wght@100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">

  <!-- FONT EPILOGUE -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=League+Spartan:wght@100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">

  <!-- FONT DM SANS -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900;1000&display=swap"
    rel="stylesheet">

  <!-- FONT POPPINS -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- LINK CSS STYLE.css -->
  <link rel="stylesheet" href="./css/style.css">

</head>

<body>
  <!-- NAVBAR -->
  <section class="navbar-container">
    <img src="./images/Logo.png" alt="Hardwell Logo">
    <nav>
      <a href="">Home</a>
      <a href="">About Us</a>
      <a href="">Services</a>
      <a href="">Project</a>
      <a href="">Contact Us</a>
    </nav>
    <button class="btn">Get Started</button>
  </section>
  <!-- Our Famous Clients -->
  <section class="famous">
    <h3>Our Famous Clients</h3>
    <div class="famous__clients">
      <img src="./images/click-center.png" alt="click center" />
      <img src="./images/digital-side.png" alt="digital side" />
      <img src="./images/vortex.png" alt="vortex" />
      <img src="./images/travel.png" alt="travel explorer" />
      <img src="./images/fuzion.png" alt="fuzion source" />
    </div>
  </section>
  </div>
  <!-- 2 DASHBOARD & STATISTIK -->
  <section class="statistic">
    <div class="statistic__image">
      <img src="./images/cowo-biru.png" alt="">
      <img src="./images/cowo-ambis.png" alt="">
    </div>
    <div class="cards">
      <div class="statistic__cards">
        <div class="statistic__cards-revenue">
          <p class="statistic__card-number">4.200</p>
          <p class="statistic__card-symbol">%</p>
        </div>
        <p class="description-statistik color-revenue">Revenue</p>
      </div>
      <div class="statistic__cards">
        <div class="statistic__cards-projects">
          <p class="statistic__card-number">73</p>
          <p class="statistic__card-symbol">+</p>
        </div>
        <p class="description-statistik color-projects">Projects</p>
      </div>
      <div class="statistic__cards">
        <div class="statistic__cards-uptime">
          <p class="statistic__card-number">99.5</p>
          <p class="statistic__card-symbol">+</p>
        </div>
        <p class="description-statistik color-uptime">Uptime</p>
      </div>
    </div>
  </section>
</body>

</html>

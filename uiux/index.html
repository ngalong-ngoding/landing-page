<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UIUX</title>

  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <!-- Hero section -->
  <section class="hero">
    <div class="hero__content">
      <h1 class="hero__content-title">UX/UI assets for creators worldwide</h1>
      <p class="hero__content-description">Becoming a member gives you access to education, resources, and community to
        help
        you grow your career and your
        bank account.</p>
      <button class="btn">Join For Free</button>
      <!-- Element hole with absolute position -->
      <img class="hero__content-hole" src="./images/hole.png" alt="" />
    </div>
    <img class="hero__image" src="./images/hero-image.png" alt="hero image" />
    <!-- Elements with absolute -->
    <img class="hero__ellipse" src="./images/ellipse/ellipse-blue.png" alt="">
    <img class="hero__spring" src="./images/spring.png" alt="">
  </section>
</body>

</html>
